<!doctype html>
<html lang="ug" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>كىتابخانا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a candle-lit reading room. Each category is a dark walnut shelf with a brass plaque and a string of warm lights; books stand as colored spines of varied height, rows packed to the screen width, with small decor (candle, plant, lying books) filling gaps. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#0e0a08; --wall:#17100c; --fg:#eadfc9; --muted:#a39682; --line:#3a2d22; --panel:#1b1510;
  --wood1:#5a3d26; --wood2:#2d1f15; --brass:#c9a35a; --brass-fg:#2b1f0c;
  --gold:#e8cf94; --accent:#e0b66a; --hl:#8a6a10; --hl-fg:#fff3c9; --glow:#ffd98a;
  --bg2:#18100b; --shelf1:#1d140e; --hlfg:#fff3c9;
  --ui:'UKIJArabic','Alkatip','Noto Naskh Arabic','Noto Sans Arabic','Segoe UI',system-ui,sans-serif; --ar:'UKIJArabic','Alkatip','Noto Naskh Arabic','Droid Arabic Naskh','Segoe UI',serif;
}
*{box-sizing:border-box}
body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 22px),linear-gradient(var(--bg),var(--bg2));background-color:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.7}
.wrap{max-width:1240px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wood2)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(var(--wood1),var(--wood2));color:#f3e7d1;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.hin{max-width:1208px;margin:0 auto}
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow h1{font:700 19px var(--ar);margin:0;color:var(--gold);flex:none}
.searchrow button{flex:none;padding:8px 12px}
.subrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.subrow .seg{margin-inline-start:auto}
.scopebar{margin-top:14px}.scopebar select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font:500 14px var(--ar);max-width:100%}
.searchrow #gear{padding:7px 9px;line-height:0}
.subrow:empty,.subrow:has(#status:empty){display:none}
.set section{margin-bottom:26px}
.set h3{font:700 16px var(--ar);color:var(--accent);margin:0 0 10px}
.set input[type=range]{width:100%;max-width:420px;accent-color:var(--accent)}
.bmb{background:var(--panel);color:var(--accent);border:1px solid var(--line);padding:5px 12px;font-size:13px}
.subrow select{background:var(--panel);color:var(--fg);border-color:var(--line);padding:6px 10px;font-size:13px;max-width:55%}
.subrow select option{color:#201a14;background:#fbf8f1}
#q{flex:1 1 0;min-width:0;font:400 16px var(--ar);padding:7px 12px;border:0;border-radius:4px;background:#fbf8f1;color:#201a14}
#q::placeholder{color:#7a705f}
#q:focus,button:focus-visible,.sp:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
select,button{font:500 14px var(--ui);padding:9px 14px;border:1px solid rgba(255,255,255,.25);border-radius:4px;background:rgba(0,0,0,.22);color:#f3e7d1;cursor:pointer}
select option{color:#201a14;background:#fbf8f1}
button.go{background:var(--brass);color:var(--brass-fg);border-color:var(--brass);font-weight:600}
#status{font-size:12.5px;color:var(--muted)}
.bar{height:2px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
/* shelves */
.case{margin-top:30px}
.plaque{display:inline-flex;align-items:baseline;gap:10px;background:linear-gradient(#d6b46c,#a98640);color:var(--brass-fg);padding:3px 18px;border-radius:3px 3px 0 0;font:700 17px var(--ar);box-shadow:0 1px 0 rgba(255,255,255,.35) inset}
.plaque small{font:500 12px var(--ui);opacity:.75}
.shelf{position:relative;background:linear-gradient(var(--shelf1),var(--wall));padding-top:14px;border-inline:9px solid var(--wood2);border-top:7px solid var(--wood2);box-shadow:inset 0 16px 24px -12px rgba(0,0,0,.7),0 12px 24px rgba(0,0,0,.5)}
.lights{height:26px;position:relative;margin-inline:-9px;overflow:hidden;pointer-events:none}
.lights::before{content:"";position:absolute;inset:3px 0 auto;height:14px;border-bottom:1px solid rgba(255,230,170,.35);border-radius:0 0 50% 50%/0 0 100% 100%;background:none;opacity:.7}
.lights i{position:absolute;top:10px;width:7px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px 3px rgba(255,200,100,.55),0 0 18px 6px rgba(255,170,60,.25);animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.55}to{opacity:1}}
.row{padding:12px 14px 0}
.books{display:flex;align-items:flex-end;gap:7px;min-height:150px;padding-top:6px}
.plank{height:15px;margin-inline:-14px;background:linear-gradient(#6a4930,var(--wood2));box-shadow:0 8px 10px -2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.16) inset}
.sp{--h:210;--s:38%;--l:28%;position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 0 8px;border:0;border-radius:2px 2px 1px 1px;cursor:pointer;color:var(--gold);
  background:linear-gradient(90deg,hsl(var(--h) var(--s) calc(var(--l) - 8%)),hsl(var(--h) var(--s) calc(var(--l) + 5%)) 38%,hsl(var(--h) var(--s) calc(var(--l) - 10%)));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),3px 0 4px rgba(0,0,0,.55);transition:transform .15s}
.sp::before,.sp::after{content:"";position:absolute;inset-inline:0;height:3px;border-block:1px solid rgba(232,207,148,.55)}
.sp::before{top:8px}.sp::after{bottom:26px}
.sp:hover{transform:translateY(-9px)}
.sp .t{writing-mode:vertical-rl;font:600 15px/1.35 var(--ar);flex:1;margin-top:10px;max-height:calc(100% - 44px);overflow:hidden;text-align:start}
.sp .c{font:600 11px var(--ui);opacity:.75;margin-top:6px;z-index:1}
.sp .x{position:absolute;top:-12px;inset-inline:50%;transform:translateX(50%);z-index:3;background:rgba(0,0,0,.7);color:#f3e7d1;border-radius:11px;min-width:22px;height:22px;padding:0 7px;font:600 12px/22px var(--ar);white-space:nowrap;text-align:center}
[dir=rtl] .sp .x{inset-inline:auto;left:50%;transform:translateX(-50%)}
.sp .x.sure{background:#a02a2a}
.sp.add{background:transparent;border:2px dashed var(--brass);box-shadow:none;color:var(--accent)}
.sp.add::before,.sp.add::after{display:none}
.sp.add b{font:400 28px/1 var(--ui)}
.cv{padding:12px 10px 10px 16px;border-radius:3px 6px 6px 3px;background:linear-gradient(135deg,hsl(var(--h) var(--s) calc(var(--l) + 7%)),hsl(var(--h) var(--s) calc(var(--l) - 6%)));box-shadow:3px 4px 6px rgba(0,0,0,.55)}
.cv::before{inset-block:0;inset-inline:0 auto;width:10px;height:auto;border:0;border-radius:3px 0 0 3px;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.12) 60%,rgba(0,0,0,.25))}
.cv::after{inset:7px 7px 7px 15px;height:auto;border:1px solid rgba(232,207,148,.45)}
.cv .t{writing-mode:horizontal-tb;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font:600 16px/1.6 var(--ar);text-align:center;width:100%;margin-top:6px;max-height:none;flex:1;z-index:1}
.cv .r{width:34px;height:2px;background:var(--gold);opacity:.6;z-index:1}
.cv .c{font-size:12px;margin-top:6px;padding-bottom:4px}
.cv.add{background:transparent;border:2px dashed var(--brass);box-shadow:none;justify-content:center;gap:6px}
.cv.add::before,.cv.add::after{display:none}
.cv.add .t{flex:none;font-size:14px;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);color:var(--muted);padding:5px 12px;font-size:13px}
.seg button.on{background:var(--brass);color:var(--brass-fg);font-weight:600}
.cont{margin-top:22px}
.clab{font:700 15px var(--ar);color:var(--accent);margin-bottom:8px}
.cards{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.cc{flex:none;min-width:190px;max-width:260px;text-align:start;display:grid;gap:2px;padding:10px 14px;border:1px solid var(--line);border-inline-start:4px solid var(--brass);border-radius:4px;background:var(--panel);color:var(--fg)}
.cc b{font:700 16px var(--ar)}.cc span{font:400 13.5px var(--ar);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aib{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.aib button{background:var(--panel);color:var(--accent);border:1px solid var(--line);padding:9px 16px}
.qh{color:var(--muted);font-size:13px;margin-bottom:6px}
.qq{font:700 clamp(19px,2.6vw,24px)/1.7 var(--ar);margin:0 0 14px}
.qo{display:grid;gap:10px}
.qo button{text-align:start;font:500 17px/1.7 var(--ar);padding:12px 16px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.qo button:disabled{opacity:1;cursor:default}
.qo button.right{background:rgba(63,143,90,.3);border-color:#3f8f5a;color:var(--fg)}
.qo button.wrong{background:rgba(176,64,64,.3);border-color:#b04040;color:var(--fg)}
.why{font:400 17px/1.9 var(--ar);color:var(--muted);margin:14px 0 0}
.qscore{font:700 44px var(--ui);color:var(--accent)}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pal{display:grid;gap:8px;text-align:start;padding:10px;border:2px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:600 15px var(--ar)}
.pal.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pal .ch{display:flex;height:26px;border-radius:4px;overflow:hidden;border:1px solid rgba(128,128,128,.35)}
.pal .ch i{flex:1}
.cust{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.cust label{display:grid;gap:4px;font-size:13px;font-weight:600}
.cust input[type=color]{width:64px;height:40px;padding:2px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.dec{flex:none;display:block}
.flame{animation:fl 1.6s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(.92,1.08)}}
.fab{position:fixed;z-index:25;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;padding:0;background:#f1e8d6;color:#2b1f0c;font:400 32px/56px var(--ui);box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.2)}
.fab:hover{background:#fff}
.form{display:grid;gap:12px;max-width:520px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form input[type=text],.form select{font:400 17px var(--ar);padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg)}
.form input[type=file]{font:400 14px var(--ui);color:var(--fg)}
.form .hint{font-size:13px;color:var(--muted);line-height:1.8}
.form button.go{justify-self:start;padding:10px 22px}
.ovhead button.del{background:rgba(160,30,30,.55)}
@media(prefers-reduced-motion:reduce){.lights i,.flame{animation:none}.sp{transition:none}}
/* full-screen reader */
#ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
#ov[hidden]{display:none}
.ovhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(var(--wood1),var(--wood2));color:#f3e7d1;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.ovhead.tight{flex-wrap:nowrap;gap:6px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
.ovhead.tight button{padding:5px 10px;font-size:13px}
.ovhead.tight h2{font-size:15px;flex:1 1 0}
.ovhead h2{font:700 19px var(--ar);margin:0;color:var(--gold);flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovhead .sp{flex:1}
.ovbody{flex:1;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovin{max-width:1060px;margin:0 auto}
#tf{flex:1 1 220px;min-width:0;font:400 16px var(--ar);padding:7px 12px;border:0;border-radius:4px;background:#fbf8f1;color:#201a14}
.pager{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pager button{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:5px 12px;font-size:13px}
.pager button.on{background:var(--wood2);color:var(--gold);border-color:var(--wood2)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mi{display:flex;gap:10px;align-items:flex-start;text-align:start;padding:12px 14px;border:1px solid var(--line);border-inline-start:4px solid var(--brass);border-radius:4px;background:var(--panel);color:var(--fg);font:500 16px/1.6 var(--ar)}
.mi:hover{border-color:var(--brass);background:var(--wall)}
.mi b{font:600 12px var(--ui);color:var(--accent);min-width:2.2em;padding-top:5px}
.mi span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.sec h3{font:700 clamp(19px,3vw,28px)/1.6 var(--ar);margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--brass)}
.txt{font:400 20px/2.1 var(--ar);white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.nav button{background:var(--wood2);color:var(--gold);border-color:var(--wood2);padding:10px 20px}
.nav button:disabled{opacity:.35;cursor:default}
mark{background:var(--hl);color:var(--hl-fg);padding:0 2px;border-radius:2px}
/* results */
.res{border-bottom:1px solid var(--line);padding:12px 0}
.res .ttl{font:600 16px var(--ar)}
.res .sn{font:400 18px/1.9 var(--ar);cursor:pointer;margin-top:2px}
.res .sn:hover{background:var(--panel)}
.grp{font:700 17px var(--ar);margin:26px 0 2px;color:var(--accent)}
.note{color:var(--muted);font-size:13.5px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--ui)}
header.top{background:color-mix(in srgb,var(--wood2) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 1px 0 rgba(255,255,255,.08),0 10px 26px rgba(0,0,0,.28)}
.searchrow h1{font:700 24px var(--ar);letter-spacing:0}
#q{border-radius:999px;padding:9px 18px;font:400 17px var(--ar);background:rgba(255,255,255,.93);box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.searchrow button{border-radius:999px}
button.go{padding:8px 16px}
.plaque{display:flex;align-items:baseline;gap:12px;width:100%;background:none;box-shadow:none;color:var(--fg);padding:0 2px 10px;border-radius:0;font:700 24px var(--ar)}
.plaque small{font:400 14px var(--ui);color:var(--muted)}
.plaque::after{content:"";flex:1;align-self:center;height:1px;background:linear-gradient(to left,var(--brass),transparent)}
.case{margin-top:34px;scroll-margin-top:84px}
.shelf{border-radius:12px;border-top-width:8px;box-shadow:inset 0 18px 26px -14px rgba(0,0,0,.55),0 16px 34px rgba(0,0,0,.35)}
.cv{border-radius:4px 10px 10px 4px;background:linear-gradient(115deg,rgba(255,255,255,.17),transparent 42%),linear-gradient(135deg,hsl(var(--h) var(--s) calc(var(--l) + 7%)),hsl(var(--h) var(--s) calc(var(--l) - 6%)));box-shadow:4px 6px 10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06)}
.cv .t{font:700 18px/1.65 var(--ar);color:#f2dfae;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.cv .c{font:400 13px var(--ui);opacity:.85}
.sp .t{font:700 16px/1.4 var(--ar)}
.sp{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sp:hover{transform:translateY(-10px) rotate(-.7deg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:999px;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:6px 16px;font:400 15px var(--ar)}
.chips button:hover{border-color:var(--brass);color:var(--accent)}
.clab{font:700 17px var(--ar);color:var(--fg)}
.cc{border-radius:12px;padding:12px 16px;border-inline-start-width:4px}
.cc b{font:700 18px var(--ar)}
.mi,.pal,.qo button,.reader,.toc{border-radius:12px}
.mi{font:400 17px/1.6 var(--ar);transition:transform .15s,border-color .15s}
.mi:hover{transform:translateY(-2px)}
.mi b{font:400 13px var(--ui)}
.sec h3{font:700 clamp(22px,3.2vw,32px)/1.7 var(--ar)}

<script>
const $=s=>document.querySelector(s);

const HUE={fav:45,fetva:212,tefsir:350,kuran:152,hadis:30,dua:78,siyer:186,diger:285};
const AR_MAP={'ي':'ي','ى':'ي','ی':'ي','ې':'ي','ێ':'ي','ك':'ك','ک':'ك','ھ':'ه','ە':'ه','ہ':'ه','ة':'ه','أ':'ا','إ':'ا','آ':'ا','ٱ':'ا','ۋ':'و','ۆ':'و','ۇ':'و','ۈ':'و','ؤ':'و','ئ':'ي','ڭ':'ن','گ':'ك','چ':'ج','ژ':'ز','پ':'ب','ڤ':'ف'};
function nz(s){
  s=s.normalize('NFKC').replace(/[ً-ٰٟۖ-ۭـ‌‍‎‏]/g,'');
  let o='';for(const ch of s)o+=AR_MAP[ch]||ch.toLowerCase();
  return o.replace(/\s+/g,' ');
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const bookById=id=>META.books.find(b=>b.id===id);
const setStatus=t=>{$('#status').textContent=(t==='ئىزدەشكە تەييار.')?'':t};
const nTxt=()=>META.books.filter(b=>b.n).length;
let SCOPE='all';
function buildScope(){return}
function _unusedBuildScope(){
  const sc=$('#scope'),v=sc.value;
  sc.innerHTML='<option value="all">بارلىق كىتابلار</option>'+Object.entries(META.cats).map(([k,v])=>`<option value="c:${k}">${v}</option>`).join('')+META.books.map(b=>`<option value="b:${b.id}">${esc(b.t)}</option>`).join('');
  if([...sc.options].some(o=>o.value===v))sc.value=v;
}
async function init(){
  META=await (await fetch('books.json')).json();
  META.books=META.books.filter(b=>b.n&&b.id!=='b22');
  const builtin=META.books.slice();
  for(const u of await dbAll()){META.books.push({id:u.id,t:u.t,c:u.c,n:u.data.length,user:true});DATA[u.id]=u.data;IDX[u.id]=u.data.map(s=>nz(s[0]+'\n'+s[1]))}
  buildScope();home();loadAll(builtin);
}
async function loadAll(list){
  total=list.length;
  for(const b of list){
    try{const d=await (await fetch(`data/${b.id}.json`)).json();DATA[b.id]=d;IDX[b.id]=d.map(s=>nz(s[0]+'\n'+s[1]))}
    catch(e){DATA[b.id]=[];IDX[b.id]=[]}
    loaded++;$('#bar i').style.width=(100*loaded/total)+'%';
    if(loaded<total)setStatus(`ئىزدەش ئىندېكسى تەييارلىنىۋاتىدۇ… ${loaded}/${total}`);
    else{setStatus('ئىزدەشكە تەييار.');setTimeout(()=>$('#bar').hidden=true,600)}
    if(cur&&cur.type==='toc'&&cur.id===b.id)openBook(b.id,0,'');
  }
  if($('#q').value.trim())search();
}
const spineH=(b,i)=>150+((i*37+b.t.length*13)%6)*13;
function spineW(b){const n=b.t.length;return n<=13?40:n<=26?58:76}
const DECOR=[
 `<svg class="dec" width="34" height="74" viewBox="0 0 34 74" aria-hidden="true"><ellipse cx="17" cy="14" rx="9" ry="12" fill="rgba(255,190,80,.22)"/><path class="flame" d="M17 4c5 6 5 11 0 14-5-3-5-8 0-14z" fill="#ffcf6b"/><rect x="9" y="22" width="16" height="50" rx="2" fill="#efe3c6"/><rect x="9" y="22" width="16" height="6" fill="#d9c9a3"/></svg>`,
 `<svg class="dec" width="64" height="96" viewBox="0 0 64 96" aria-hidden="true"><path d="M32 60C20 46 10 36 12 20c10 4 18 14 20 40zM32 60C30 40 34 22 46 8c4 18-2 36-14 52zM32 60c14-8 24-4 28-18-14-2-24 4-28 18z" fill="#3f6b45"/><path d="M18 62h28l-4 32H22z" fill="#8a4b2d"/><rect x="16" y="58" width="32" height="7" rx="2" fill="#a05b38"/></svg>`,
 `<svg class="dec" width="78" height="46" viewBox="0 0 78 46" aria-hidden="true"><rect x="4" y="30" width="70" height="14" rx="2" fill="#6b2f3a"/><rect x="8" y="16" width="64" height="14" rx="2" fill="#2f5a6b"/><rect x="2" y="2" width="66" height="14" rx="2" fill="#7a6a2e"/><rect x="10" y="35" width="40" height="2" fill="#e8cf94" opacity=".6"/></svg>`,
 `<svg class="dec" width="50" height="86" viewBox="0 0 50 86" aria-hidden="true"><path d="M17 12a8 8 0 0116 0" fill="none" stroke="#b8924a" stroke-width="3"/><rect x="10" y="14" width="30" height="62" rx="4" fill="rgba(255,200,110,.18)" stroke="#b8924a" stroke-width="3"/><path class="flame" d="M25 34c6 8 6 14 0 18-6-4-6-10 0-18z" fill="#ffcf6b"/><rect x="8" y="76" width="34" height="8" rx="2" fill="#b8924a"/></svg>`
];
const DW=[34,64,78,50];
function lightsHtml(w){const n=Math.max(4,Math.floor(w/52));let h='';for(let i=0;i<n;i++)h+=`<i style="inset-inline-start:${(i+.5)*100/n}%;top:${8+Math.round(5*Math.sin(i*Math.PI/(n-1||1)*1))+ (i%2?3:0)}px;animation-delay:${(i%5)*.45}s"></i>`;return h}
let ST={last:[],fav:[],bm:[]};try{ST=Object.assign(ST,JSON.parse(localStorage.getItem('kx')||'{}'))}catch(e){}
const stSave=()=>{try{localStorage.setItem('kx',JSON.stringify(ST))}catch(e){}};
const isFav=id=>ST.fav.includes(id), isBM=(id,i)=>ST.bm.some(x=>x.id===id&&x.sec===i);
function toggleFav(id){ST.fav=isFav(id)?ST.fav.filter(x=>x!==id):[...ST.fav,id];stSave()}
function toggleBM(id,i){ST.bm=isBM(id,i)?ST.bm.filter(x=>!(x.id===id&&x.sec===i)):[...ST.bm,{id,sec:i}];stSave()}
function remember(id,sec){ST.last=[{id,sec},...ST.last.filter(x=>x.id!==id)].slice(0,6);stSave()}
let MODE='cover';try{MODE=localStorage.getItem('vm')||'cover'}catch(e){}
function setMode(m){MODE=m;try{localStorage.setItem('vm',m)}catch(e){}if(cur&&cur.type==='home')home()}
function home(){

  cur={type:'home'};$('#clr').hidden=true;
  const W=Math.max(240,Math.min(1240,innerWidth)-32-18-28);
  const CW=innerWidth>=1100?150:innerWidth>=760?128:108,K=CW/108;
  let h='';let di=0;
  const favBooks=ST.fav.map(bookById).filter(Boolean);
  h+=`<nav class="chips">${Object.entries(META.cats).filter(([k])=>META.books.some(b=>b.c===k)).map(([k,v])=>`<button type="button" data-jump="${k}">${v}</button>`).join('')}</nav>`;
  const cont=ST.last.filter(x=>bookById(x.id)).slice(0,3);
  if(cont.length)h+=`<section class="cont"><div class="clab">ئوقۇشنى داۋاملاشتۇرۇش</div><div class="cards">${cont.map(x=>{const b=bookById(x.id),d=DATA[x.id];return `<button class="cc" data-res="${x.id}:${x.sec}"><b>${esc(b.t)}</b><span>${d&&d[x.sec]?esc((d[x.sec][0]||'').slice(0,60)):''}</span></button>`}).join('')}</div></section>`;
  const catList=[...(favBooks.length?[['fav','ئامراق كىتابلار']]:[]),...Object.entries(META.cats)];
  for(const [k,name] of catList){
    const own=k==='fav'?favBooks:META.books.filter(b=>b.c===k);
    const CV=MODE==='cover';
    const items=[...own.map(b=>({b,i:Math.max(0,META.books.filter(x=>x.c===b.c).indexOf(b)),w:CV?CW:spineW(b)})),...(k==='fav'?[]:[{add:1,w:CV?CW:44}])];
    h+=`<section class="case" id="cat-${k}"><div class="plaque">${name}<small>${own.length} كىتاب</small></div><div class="shelf">`;
    let idx=0;
    while(idx<items.length){
      let used=0,row=[];
      while(idx<items.length&&(used+items[idx].w+5<=W||!row.length)){used+=items[idx].w+5;row.push(items[idx++])}
      let html='';
      row.forEach(it=>{
        if(it.add&&CV){html+=`<button class="sp cv add" data-add="${k}" style="width:${CW}px;height:${Math.round(150*K)}px"><b style="font:400 34px/1 var(--ui);color:var(--accent)">+</b><span class="t">كىتاب قوشۇش</span></button>`;return}
        if(it.add){html+=`<button class="sp add" data-add="${k}" style="width:44px;height:150px" aria-label="كىتاب قوشۇش"><b>+</b><span class="t" style="flex:1;margin-top:8px;font-size:13px">كىتاب قوشۇش</span></button>`;return}
        const b=it.b,i=it.i,hh=spineH(b,i),l=22+((i*7)%5)*2.2,sat=32+((i*11)%4)*6,hue=HUE[b.c]+((i*23)%7)*6-18;
        if(CV){html+=`<button class="sp cv ${b.user?'mine':''}" data-id="${b.id}" style="width:${CW}px;height:${Math.round(((b.t.length>24?184:150)+((i*5)%3)*8)*K)}px;--h:${hue};--s:${sat}%;--l:${l}%">${b.user?`<span class="x" role="button" data-del="${b.id}" aria-label="ئۆچۈر">×</span>`:''}<span class="t">${esc(b.t)}</span><i class="r"></i><span class="c">${b.n} بۆلەك</span></button>`;return}
        html+=`<button class="sp ${b.user?'mine':''}" data-id="${b.id}" style="width:${it.w}px;height:${Math.round(hh*K)}px;--h:${hue};--s:${sat}%;--l:${l}%">${b.user?`<span class="x" role="button" data-del="${b.id}" aria-label="ئۆچۈر">×</span>`:''}<span class="t">${esc(b.t)}</span><span class="c">${b.n}</span></button>`;
      });
      h+=`<div class="row"><div class="books">${html}</div><div class="plank"></div></div>`;
    }
    h+='</div></section>';
  }
  $('#main').innerHTML=h;
  setStatus(loaded<total?`ئىزدەش ئىندېكسى تەييارلىنىۋاتىدۇ… ${loaded}/${total}`:'ئىزدەشكە تەييار.');
}
$('#main').addEventListener('click',e=>{
  const jp=e.target.closest('[data-jump]');if(jp){const el=document.getElementById('cat-'+jp.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const rc=e.target.closest('[data-res]');if(rc){const [id,i]=rc.dataset.res.split(':');return DATA[id]?openSec(id,+i):openBook(id)}
  const dx=e.target.closest('[data-del]');if(dx){
    if(dx.classList.contains('sure')){const id=dx.dataset.del;META.books=META.books.filter(b=>b.id!==id);delete DATA[id];delete IDX[id];dbDel(id);buildScope();home();return}
    dx.classList.add('sure');dx.textContent='ئۆچۈرەمسىز؟';setTimeout(()=>{if(dx.isConnected){dx.classList.remove('sure');dx.textContent='×'}},3500);return}
  const ad=e.target.closest('[data-add]');if(ad)return openAdd(ad.dataset.add);
  const t=e.target.closest('.sp:not(.add)');if(t)return openBook(t.dataset.id);
  const r=e.target.closest('[data-open]');if(r){const [id,i]=r.dataset.open.split(':');openSec(id,+i,$('#q').value.trim())}
});
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const PAGE=60;let fs=+(ssGet('fs')||(innerWidth>=900?22:19));
function closeOv(){$('#ov').hidden=true;document.body.style.overflow='';const sr=!!$('#q').value.trim();cur={type:sr?'search':'home'};if(!sr){const y=scrollY;home();scrollTo(0,y)}}
function ovShow(html){const o=$('#ov');o.hidden=false;document.body.style.overflow='hidden';o.innerHTML=html}
function openBook(id,page=0,filter=''){
  const b=bookById(id);cur={type:'toc',id,page,filter};
  const d=DATA[id];
  const head=`<div class="ovhead"><button id="xc">× يېپىش</button><h2>${esc(b.t)}</h2><button id="fv">${isFav(id)?'★':'☆'} ئامراق</button><button id="ai1">✦ خۇلاسە</button><button id="ai2">✦ سىناق</button>${b.user?'<button class="del" id="dl">ئۆچۈر</button>':''}${b.n&&d?`<input id="tf" type="search" placeholder="بۇ كىتاب ئىچىدىن ئىزدەش…" value="${esc(filter)}">`:''}</div>`;
  if(!b.n)return ovShow(head+`<div class="ovbody"><div class="ovin"><p class="note">${esc(b.note)}</p></div></div>`),bindClose();
  if(!d)return ovShow(head+`<div class="ovbody"><div class="ovin"><p class="note">كىتاب يۈكلىنىۋاتىدۇ…</p></div></div>`),bindClose();
  let list=d.map((x,i)=>i),note='';
  const nq=nz(filter).trim();
  if(nq){list=list.filter(i=>IDX[id][i].includes(nq));note=`<p class="note">${list.length} بۆلەك ئۇچرىدى</p>`}
  const pages=Math.ceil(list.length/PAGE);page=Math.min(page,Math.max(0,pages-1));
  const pager=pages>1?`<div class="pager">${Array.from({length:pages},(_,p)=>`<button data-pg="${p}" class="${p===page?'on':''}">${p*PAGE+1}–${Math.min(list.length,(p+1)*PAGE)}</button>`).join('')}</div>`:'';
  const items=list.slice(page*PAGE,(page+1)*PAGE).map(i=>`<button class="mi" data-sec="${i}"><b>${i+1}</b><span>${esc((d[i][0]||'—').slice(0,110))}</span></button>`).join('');
  const lastE=ST.last.find(x=>x.id===id);
  const resume=(lastE&&!nq&&d[lastE.sec])?`<button class="mi" data-sec="${lastE.sec}" style="margin-bottom:12px;border-color:var(--brass);width:100%"><b>▶</b><span>داۋاملاشتۇرۇش: ${esc((d[lastE.sec][0]||'').slice(0,80))}</span></button>`:'';
  ovShow(head+`<div class="ovbody"><div class="ovin">${resume}${note}${pager}<div class="menu">${items}</div></div></div>`);
  if($('#ai1')){$('#ai1').onclick=()=>openAI(id,null,'sum');$('#ai2').onclick=()=>openAI(id,null,'quiz')}
  const fv=$('#fv');if(fv)fv.onclick=()=>{toggleFav(id);fv.textContent=(isFav(id)?'★':'☆')+' ئامراق'};
  bindClose();
  const tf=$('#tf');
  tf.oninput=()=>{clearTimeout(tf._t);tf._t=setTimeout(()=>{const v=tf.value;openBook(id,0,v);const t2=$('#tf');t2.focus();t2.setSelectionRange(v.length,v.length)},250)};
  $('#ov').onclick=e=>{
    const p=e.target.closest('[data-pg]');if(p){openBook(id,+p.dataset.pg,filter);return}
    const m=e.target.closest('[data-sec]');if(m)openSec(id,+m.dataset.sec,filter);
  };
}
function openBM(){
  cur={type:'bm'};
  const items=ST.bm.filter(x=>bookById(x.id)).map(x=>{const b=bookById(x.id),d=DATA[x.id];const t=d&&d[x.sec]?d[x.sec][0]:'';return `<button class="mi" data-bm="${x.id}:${x.sec}"><b>★</b><span><strong>${esc(b.t)}</strong><br>${esc((t||'').slice(0,90))}</span></button>`}).join('');
  ovShow(`<div class="ovhead"><button id="xc">× يېپىش</button><h2>بەتبەلگىلەر</h2></div><div class="ovbody"><div class="ovin">${items?`<div class="menu">${items}</div>`:'<p class="note">تېخى بەتبەلگە يوق. بۆلەك ئوقۇۋاتقاندا ئۈستىدىكى ☆ نى بېسىڭ.</p>'}</div></div>`);
  bindClose();
  $('#ov').onclick=e=>{const m=e.target.closest('[data-bm]');if(m){const [id,i]=m.dataset.bm.split(':');DATA[id]?openSec(id,+i):openBook(id)}};
}
function bindClose(){const x=$('#xc');if(x)x.onclick=closeOv;const d=$('#dl');if(d)d.onclick=()=>{
  if(d.dataset.sure){const id=cur.id;META.books=META.books.filter(b=>b.id!==id);delete DATA[id];delete IDX[id];dbDel(id);buildScope();closeOv();home();return}
  d.dataset.sure=1;d.textContent='جەزملەشتۈرۈڭ';setTimeout(()=>{if(d.isConnected){delete d.dataset.sure;d.textContent='ئۆچۈر'}},3500)}}
// ---- user books: storage (IndexedDB, per viewer) ----
let _db=null;
function dbOpen(){return new Promise(res=>{try{const r=indexedDB.open('kitapxana',1);r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
async function dbAll(){try{_db=_db||await dbOpen();if(!_db)return[];return await new Promise(res=>{const q=_db.transaction('books').objectStore('books').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}catch(e){return[]}}
async function dbPut(o){try{_db=_db||await dbOpen();if(!_db)return false;return await new Promise(res=>{const t=_db.transaction('books','readwrite');t.objectStore('books').put(o);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}catch(e){return false}}

function decBuf(buf){
  const u=new Uint8Array(buf);
  if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(u);
  if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(u);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u).replace(/^\ufeff/,'')}catch(e){}
  try{return new TextDecoder('windows-1256').decode(u)}catch(e){return new TextDecoder().decode(u)}
}
function htmlText(h){
  const doc=new DOMParser().parseFromString(h,'text/html');
  const title=(doc.title||'').trim();
  doc.querySelectorAll('script,style,head').forEach(n=>n.remove());
  const t=doc.body?doc.body.innerHTML.replace(/<(br|\/p|\/div|\/h\d|\/li|\/tr)[^>]*>/gi,'\n'):'';
  const d2=new DOMParser().parseFromString(t,'text/html');
  return [title,cleanTxt(d2.body.textContent||'')];
}
const cleanTxt=t=>t.normalize('NFKC').replace(/[\u202a-\u202e\u200e\u200f\ufeff]/g,'').replace(/[ \t\u3000\xa0]+/g,' ').replace(/\s*\n\s*/g,'\n').trim();
const natCmp=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
function chunk(text,name){
  if(text.length<9000)return [[name,text]];
  const paras=text.split('\n');const out=[];let cur='';
  for(const p of paras){if(cur.length+p.length>6000&&cur){out.push(cur);cur=''}cur+=(cur?'\n':'')+p}
  if(cur)out.push(cur);
  return out.map((x,i)=>[`${name} — ${i+1}`,x]);
}
async function readFiles(files,onMsg){
  const out=[];
  for(const f of files){
    const ext=f.name.split('.').pop().toLowerCase();
    if(ext==='pdf'){out.push(...await pdfSections(f,onMsg))}
    else if(ext==='iso'||ext==='dmg'){throw new Error('disc')}
    else if(ext==='apk'||ext==='zip'||ext==='ipa'){
      if(typeof JSZip==='undefined')throw new Error('zip');
      onMsg('ئوقۇلىدۇ: '+f.name);
      const z=await JSZip.loadAsync(f);
      const names=Object.keys(z.files).filter(n=>/\.(html?|txt)$/i.test(n)&&!z.files[n].dir&&!/(^|\/)(index|about|search|error|dialog|home|spec|license|strings)/i.test(n.split('/').pop()||'')&&!/(^|\/)(res|META-INF)\//.test(n)&&!/(jquery|cordova|zepto|underscore)/i.test(n)).sort(natCmp);
      for(const n of names){
        const t=decBuf(await z.files[n].async('arraybuffer'));
        let title='',x;
        if(/\.html?$/i.test(n)){[title,x]=htmlText(t)}else x=cleanTxt(t);
        if(x.length<30)continue;
        if(!title||title.length<3)title=x.split('\n')[0].slice(0,70);
        out.push([title.slice(0,110),x]);
      }
    }else if(ext==='json'){
      const j=JSON.parse(decBuf(await f.arrayBuffer()));
      for(const it of (Array.isArray(j)?j:[])){const a=Array.isArray(it)?it:[it.title||it.t||'',it.text||it.x||''];if(String(a[1]).length>=20)out.push([String(a[0]).slice(0,110),cleanTxt(String(a[1]))])}
    }else if(/^html?$/.test(ext)){
      const [t,x]=htmlText(decBuf(await f.arrayBuffer()));if(x.length>=30)out.push([t||x.split('\n')[0].slice(0,70),x]);
    }else{
      const x=cleanTxt(decBuf(await f.arrayBuffer()));if(x.length>=30)out.push(...chunk(x,f.name.replace(/\.[^.]+$/,'')));
    }
  }
  return out;
}

const loadScript=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)});
async function pdfLib(){
  if(window.pdfjsLib)return window.pdfjsLib;
  const m=await import('./pdfjs/pdf.mjs');
  m.GlobalWorkerOptions.workerSrc=new URL('./pdfjs/pdf.worker.mjs',location.href).href;
  window.pdfjsLib=m;return m;
}
async function pdfSections(file,onMsg){
  const lib=await pdfLib();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let n=1;n<=doc.numPages;n++){
    onMsg(`PDF ئوقۇلىۋاتىدۇ: ${n}/${doc.numPages}`);
    const tc=await (await doc.getPage(n)).getTextContent();
    let out='',y=null;
    for(const it of tc.items){
      if(!it.str&&!it.hasEOL)continue;
      const yy=it.transform?it.transform[5]:null;
      if(y!==null&&yy!==null&&Math.abs(yy-y)>3)out+='\n';else if(out&&!/\s$/.test(out))out+=' ';
      out+=it.str;if(yy!==null)y=yy;if(it.hasEOL)out+='\n';
    }
    pages.push(cleanTxt(out));
  }
  const per=doc.numPages<=12?1:3,secs=[];
  for(let i=0;i<pages.length;i+=per){
    const t=pages.slice(i,i+per).join('\n\n').trim();if(t.length<20)continue;
    const lab=per===1?`بەت ${i+1}`:`بەت ${i+1}–${Math.min(pages.length,i+per)}`;
    secs.push(...chunk(t,lab));
  }
  return secs;
}

function gatherText(id,idxs,max=24000){
  const d=DATA[id];let list=idxs||d.map((_,i)=>i);
  if(list.length>40){const st=list.length/40;list=Array.from({length:40},(_,k)=>list[Math.floor(k*st)])}
  const per=Math.floor(max/Math.max(1,list.length));
  return list.map(i=>`## ${d[i][0]}\n${d[i][1].slice(0,per)}`).join('\n\n').slice(0,max);
}

    const q=qs[i];
    box.innerHTML=`<div class="qh">${i+1} / ${qs.length}</div><h3 class="qq">${esc(String(q.q))}</h3><div class="qo">${q.options.map((o,k)=>`<button data-k="${k}">${esc(String(o))}</button>`).join('')}</div><div id="qw"></div>`;

      const k=+bt.dataset.k;box.querySelectorAll('.qo button').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add('right')});
      if(k===q.answer)score++;else bt.classList.add('wrong');
      $('#qw').innerHTML=`${q.why?`<p class="why">${esc(String(q.why))}</p>`:''}<div class="aib"><button id="qn">${i+1<qs.length?'كېيىنكى سوئال ‹':'نەتىجىنى كۆرۈش'}</button></div>`;
      $('#qn').onclick=()=>{i++;show()};
    };
  };
  show();
}

  <div class="ovbody"><div class="ovin"><form class="form" id="af">
   <label>قايسى جارغا قوشىلىدۇ<select id="acat">${Object.entries(META.cats).map(([k,v])=>`<option value="${k}" ${k===cat?'selected':''}>${v}</option>`).join('')}</select></label>
   <label>كىتاب نامى<input type="text" id="an" required placeholder="مەسىلەن: مېنىڭ كىتابىم"></label>
   <label>ھۆججەت (PDF، APK، IPA، ZIP، TXT، HTML ياكى JSON)<input type="file" id="afile" accept=".pdf,.apk,.ipa,.zip,.txt,.html,.htm,.json" multiple required></label>
   <div class="hint">iPhone ئەپلىرى (.ipa) ئىچىدىكى HTML ۋە TXT ھۆججەتلىرى ھەم ئوقۇلىدۇ. PDF دىكى تېكىست (رەسىم شەكلىدىكى PDF ئوقۇلمايدۇ) ۋە APK ئىچىدىكى HTML ۋە TXT ھۆججەتلىرى ئوقۇلىدۇ، ھەر بىر ھۆججەت بىر بۆلەك بولىدۇ. سانلىق مەلۇمات ئامبىرى (db) ئىشلىتىدىغان ئەپلەر ھازىرچە ئوقۇلمايدۇ. قوشقان كىتابىڭىز پەقەت مۇشۇ ئۈسكۈنىدە ساقلىنىدۇ.</div>
   <button class="go" type="submit" id="asub">قوشۇش</button><div id="amsg" class="note"></div>
  </form></div></div>`);
  bindClose();
  $('#afile').onchange=()=>{const f=$('#afile').files[0];if(f&&!$('#an').value)$('#an').value=f.name.replace(/\.[^.]+$/,'')};
  $('#af').onsubmit=async e=>{
    e.preventDefault();const msg=$('#amsg'),btn=$('#asub');btn.disabled=true;msg.textContent='ئوقۇلىۋاتىدۇ…';
    try{
      const data=await readFiles([...$('#afile').files],t=>msg.textContent=t);
      if(!data.length){msg.textContent='بۇ ھۆججەتتىن ئوقۇغىلى بولىدىغان تېكىست تېپىلمىدى (PDF رەسىم شەكلىدە بولسا ئوقۇغىلى بولمايدۇ).';btn.disabled=false;return}
      const id='u'+Date.now(),t=$('#an').value.trim();cat=$('#acat').value;
      DATA[id]=data;IDX[id]=data.map(s=>nz(s[0]+'\n'+s[1]));
      META.books.push({id,t,c:cat,n:data.length,user:true});
      const ok=await dbPut({id,t,c:cat,data});
      buildScope();closeOv();home();
      if(!ok)setStatus('كىتاب قوشۇلدى، لېكىن بۇ ئۈسكۈنىدە ساقلانمىدى (بەت يېپىلسا يوقىلىدۇ).');
    }catch(err){msg.textContent=(err&&err.message==='disc')?'ISO/DMG ديسكا ئوبرازى. iPhone ئەپلىرى .ipa ھۆججىتى بولىدۇ، شۇنى تاللاڭ.':'ھۆججەتنى ئوقۇغىلى بولمىدى. ()';btn.disabled=false}
  };
}
const UG_RE=/[\u06D5\u06C7\u06C6\u06C8\u06CB\u06AD\u06BE\u06D0]/;
const ARB_RE=/[\u0621-\u064A\u0671-\u06D3]/;
function isAr(l){const t=l.replace(/<[^>]+>/g,'');return ARB_RE.test(t)&&!UG_RE.test(t)}
function arFix(s){return s.replace(/ +([\u060C.\u061F:\u061B!])/g,'$1').replace(/\[ +/g,'[').replace(/ +\]/g,']').replace(/ {2,}/g,' ')}
function fmtTxt(html){
  let out='',buf=null;
  const flush=()=>{if(buf!==null){out+='<span class="arx">'+arFix(buf)+'</span>';buf=null}};
  for(const l of html.split('\n')){
    if(isAr(l)){const t=l.trim();buf=buf===null?t:buf+' '+t;if(t.replace(/<[^>]+>/g,'').length<50)flush()}
    else{flush();out+=l+'\n'}
  }
  flush();return out;
}
function openSec(id,i,hl=''){
  const b=bookById(id),d=DATA[id],s=d[i];cur={type:'sec',id,sec:i,hl};
  const body=fmtTxt(hl?markText(s[1],hl):esc(s[1]));
  const nav=`<div class="nav"><button data-go="${i-1}" ${i<=0?'disabled':''}>› ئالدىنقى</button><button data-go="${i+1}" ${i>=d.length-1?'disabled':''}>كېيىنكى ‹</button></div>`;
  ovShow(`<div class="ovhead tight"><button id="bk">‹ مەزمۇن</button><h2>${esc(b.t)}</h2><button id="bm" aria-label="بەتبەلگە">${isBM(id,i)?'★':'☆'}</button><button id="fm">ئا−</button><button id="fp">ئا+</button><button id="xc" aria-label="يېپىش">×</button></div>
  <div class="ovbody" id="sc"><div class="ovin sec"><h3>${esc(s[0])}</h3><div class="txt" id="txt" style="font-size:${fs}px">${body}</div><div class="aib"><button data-ai="sum">✦ بۇ بۆلەكنىڭ خۇلاسىسى</button><button data-ai="quiz">✦ سىناق ئۇرۇش</button></div>${nav}</div></div>`);
  bindClose();
  remember(id,i);
  $('#bm').onclick=()=>{toggleBM(id,i);$('#bm').textContent=isBM(id,i)?'★':'☆'};
  $('#bk').onclick=()=>openBook(id,Math.floor(i/PAGE),'');
  $('#fm').onclick=()=>{fs=Math.max(12,fs-2);$('#txt').style.fontSize=fs+'px';ssSet('fs',fs)};
  $('#fp').onclick=()=>{fs=Math.min(40,fs+2);$('#txt').style.fontSize=fs+'px';ssSet('fs',fs)};
  $('#sc').onclick=e=>{const ai=e.target.closest('[data-ai]');if(ai)return openAI(id,[i],ai.dataset.ai);const g=e.target.closest('[data-go]');if(g&&!g.disabled)openSec(id,+g.dataset.go,'')};
  const mk=$('#txt mark');if(mk)mk.scrollIntoView({block:'center'});
}
function mapNorm(raw){const chars=[...raw],map=[];let n='';
  for(let i=0;i<chars.length;i++){const m=nz(chars[i]);if(m===''&&chars[i]!==' ')continue;for(const c of m){n+=c;map.push(i)}}
  return {chars,map,n}}
function markText(raw,q){
  const nq=nz(q).trim();if(!nq)return esc(raw);
  const {chars,map,n}=mapNorm(raw);let out='',last=0,from=0,cnt=0;
  while(cnt<500){const p=n.indexOf(nq,from);if(p<0)break;
    const s=map[p],e=map[p+nq.length-1]+1;
    if(s>=last){out+=esc(chars.slice(last,s).join(''))+'<mark>'+esc(chars.slice(s,e).join(''))+'</mark>';last=e}
    from=p+Math.max(1,nq.length);cnt++}
  return out+esc(chars.slice(last).join(''));
}
function snippet(raw,nq){
  const {chars,map,n}=mapNorm(raw);const p=n.indexOf(nq);if(p<0)return null;
  const s=map[p],e=map[p+nq.length-1]+1,a=Math.max(0,s-90),z=Math.min(chars.length,e+130);
  return (a>0?'… ':'')+esc(chars.slice(a,s).join(''))+'<mark>'+esc(chars.slice(s,e).join(''))+'</mark>'+esc(chars.slice(e,z).join(''))+(z<chars.length?' …':'');
}
function search(){
  const q=$('#q').value.trim();if(!q){home();return}
  cur={type:'search'};$('#clr').hidden=false;
  const nq=nz(q).trim(),scope=SCOPE;
  const ids=Object.keys(DATA).filter(id=>scope==='all'||(scope.startsWith('b:')?id===scope.slice(2):bookById(id).c===scope.slice(2)));
  let h='',tot=0,shown=0,books=0;
  for(const id of ids){
    const idx=IDX[id],d=DATA[id],hits=[];
    for(let i=0;i<idx.length;i++)if(idx[i].includes(nq))hits.push(i);
    if(!hits.length)continue;books++;tot+=hits.length;
    h+=`<div class="grp">${esc(bookById(id).t)} · ${hits.length} بۆلەكتە ئۇچرىدى</div>`;
    for(const i of hits.slice(0,12)){
      if(shown>=150)break;shown++;
      h+=`<div class="res"><div class="ttl">${esc((d[i][0]||'').slice(0,80))}</div><div class="sn" data-open="${id}:${i}">${snippet(d[i][1],nq)||esc(d[i][0])}</div></div>`;
    }
    if(hits.length>12)h+=`<div class="note">بۇ كىتابتا يەنە ${hits.length-12} بۆلەك بار. ئىزدەشنى شۇ كىتاب بىلەن چەكلەپ كۆرۈڭ.</div>`;
  }
  const pend=loaded<total?` (ئىندېكس يۈكلىنىۋاتىدۇ: ${loaded}/${total})`:'';
  const scopeSel=`<div class="scopebar"><label>دائىرە: <select id="scope">${'<option value="all">بارلىق كىتابلار</option>'+Object.entries(META.cats).map(([k,v])=>`<option value="c:${k}">${v}</option>`).join('')+META.books.map(b=>`<option value="b:${b.id}">${esc(b.t)}</option>`).join('')}</select></label></div>`;
  $('#main').innerHTML=scopeSel+(tot?'':`<p class="note">«${esc(q)}» ئۈچۈن نەتىجە تېپىلمىدى${pend}.</p>`)+h;
  const ss=$('#scope');ss.value=SCOPE;ss.onchange=()=>{SCOPE=ss.value;search()};
  setStatus(tot?`${books} كىتابتىن ${tot} بۆلەك ئۇچرىدى${pend}. نەتىجىنى چېكىپ بۆلىكىنى ئېچىڭ.`:'نەتىجە يوق'+pend);
}
$('#f').addEventListener('submit',e=>{e.preventDefault();search()});
$('#clr').addEventListener('click',()=>{$('#q').value='';home()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeOv()});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(cur&&cur.type==='home')home()},150)});
$('#gear').onclick=openSettings;
$('#fab').onclick=()=>openAdd('diger');
applyPal();
init();
</script>
